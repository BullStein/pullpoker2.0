<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Salão — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
<script>
let pwError = '';
let pwOk = '';
let uploadError = '';

function render(){
  const app = document.getElementById('app');
  loadSession();
  if(!sessionStillValid()){
    clearSession();
    app.innerHTML = navHTML('perfil.html') + `
      <div class="guard-msg"><h2>Você precisa entrar</h2><p>Volte para a mesa e crie sua conta ou faça login.</p>
      <p><a href="index.html">Ir para a Mesa</a></p></div>`;
    bindNav();
    return;
  }
  app.innerHTML = navHTML('perfil.html') + renderProfile();
  bindProfile();
  bindNav();
}

const CATS = [
  ['avatars','Foto de perfil'],
  ['colors','Cores de nome'],
  ['backgrounds','Fundo de nome (chat)'],
  ['tags','Tags'],
  ['crests','Brasões']
];

function renderProfile(){
  const user = state.users[me.key];
  const eqFieldFor = { colors:'color', tags:'tag', crests:'crest', avatars:'avatar', backgrounds:'background' };
  const ownsCustomUpload = (user.owned.avatars||[]).includes(CUSTOM_AVATAR_ID);

  const blocks = CATS.map(([cat,label])=>{
    const owned = user.owned[cat] || [];
    const eqField = eqFieldFor[cat];
    const equippedId = user.equipped[eqField];
    const shopItems = state.shop[cat] || [];
    const ownedItems = shopItems.filter(it=> owned.includes(it.id));
    const pillHTML = ownedItems.length ? ownedItems.map(it=>{
      const isEq = equippedId===it.id;
      const isCustomUpload = it.id === CUSTOM_AVATAR_ID;
      const label2 = (cat==='colors'||cat==='backgrounds') ? `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${it.hex};margin-right:4px;"></span>${escapeHTML(it.label)}`
        : (cat==='crests'||cat==='avatars') ? `${isCustomUpload?'📷':it.emoji} ${escapeHTML(it.label)}`
        : escapeHTML(it.label);
      return `<div class="owned-pill ${isEq?'equipped':''}">${label2} <button data-equip="${cat}" data-id="${escapeAttr(it.id)}">${isEq?'tirar':'usar'}</button></div>`;
    }).join('') : `<span style="color:var(--muted);font-size:12.5px;">Nada comprado ainda — <a href="loja.html">visite a loja</a>.</span>`;

    const uploadBlock = (cat==='avatars' && ownsCustomUpload) ? `
      <div class="upload-row">
        <div class="admin-note" style="margin-bottom:6px;">Você comprou a foto customizada — envie sua imagem (ela é redimensionada automaticamente):</div>
        <input type="file" accept="image/*" id="avatarUploadInput" />
        ${uploadError ? `<div class="gate-error">${escapeHTML(uploadError)}</div>` : ''}
        ${user.customAvatarData ? `<div style="margin-top:8px;"><img src="${user.customAvatarData}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--brass-dim);" /></div>` : ''}
      </div>
    ` : '';

    return `
      <div class="card side-card">
        <h3>${label}</h3>
        <div class="owned-grid">${pillHTML}</div>
        ${uploadBlock}
      </div>
    `;
  }).join('');

  return `
    <div class="profile-head">
      ${avatarBadgeHTML(user.username, 76)}
      <div>
        <h1 class="display">${nameHTML(user.username)}</h1>
        <div class="tagline">${fmt(user.balance)} pontos ${user.isAdmin ? '· conta da casa (fora do ranking)' : '· na mesa desde '+fmtDate(user.createdAt||Date.now())}</div>
      </div>
    </div>
    <div class="profile-grid">
      <div>${blocks}</div>
      <div>
        <div class="card side-card">
          <h3>Trocar senha</h3>
          <div class="form-row"><input type="password" id="curPw" placeholder="Senha atual" /></div>
          <div class="form-row"><input type="password" id="newPw" placeholder="Nova senha" /></div>
          <div class="gate-error">${pwError ? escapeHTML(pwError) : (pwOk ? '' : '')}</div>
          ${pwOk ? `<div style="color:var(--good);font-size:12.5px;margin-bottom:8px;">${escapeHTML(pwOk)}</div>` : ''}
          <button class="submit-bet" id="changePwBtn">Salvar nova senha</button>
        </div>
      </div>
    </div>
  `;
}

function bindProfile(){
  document.querySelectorAll('[data-equip]').forEach(b=>{
    b.onclick = async ()=>{ await equipItem(b.dataset.equip, b.dataset.id); render(); };
  });
  const btn = document.getElementById('changePwBtn');
  if(btn) btn.onclick = async ()=>{
    const cur = document.getElementById('curPw').value;
    const nw = document.getElementById('newPw').value;
    try{
      const res = await changePassword(cur, nw);
      if(!res.ok){ pwError = res.error; pwOk=''; render(); return; }
      pwError=''; pwOk='Senha atualizada.';
      render();
    }catch(err){
      console.error(err);
      pwError = 'Algo deu errado ao trocar a senha. Veja o console do navegador.';
      pwOk=''; render();
    }
  };
  const uploadInput = document.getElementById('avatarUploadInput');
  if(uploadInput) uploadInput.onchange = async ()=>{
    const file = uploadInput.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageToDataURL(file, 220);
      await loadState();
      const u = state.users[me.key];
      u.customAvatarData = dataUrl;
      u.equipped.avatar = CUSTOM_AVATAR_ID;
      await saveState();
      uploadError = '';
      toast('Foto atualizada');
      render();
    }catch(err){
      console.error(err);
      uploadError = 'Não consegui ler essa imagem. Tente outro arquivo.';
      render();
    }
  };
}

async function boot(){
  loadSession();
  await loadState();
  render();
}
boot();
</script>
</body>
</html>
