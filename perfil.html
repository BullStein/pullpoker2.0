<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Salão — Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
<script>
let pwError = '';
let pwOk = '';

function render(){
  const app = document.getElementById('app');
  loadSession();
  if(!sessionStillValid()){
    clearSession();
    app.innerHTML = navHTML('perfil.html') + `
      <div class="guard-msg"><h2>Você precisa entrar</h2><p>Volte para a mesa e crie sua conta ou faça login.</p>
      <p><a href="index.html">Ir para a Mesa</a></p></div>`;
    bindNav();
    return;
  }
  app.innerHTML = navHTML('perfil.html') + leftDockHTML() + rightDockHTML() + renderProfile();
  bindProfile();
  bindNav();
  bindMiniSlot();
}

const CATS = [
  ['avatars','Foto de perfil'],
  ['colors','Cores de nome'],
  ['backgrounds','Fundo do nome'],
  ['tags','Tags'],
  ['crests','Brasões']
];

function renderProfile(){
  const user = state.users[me.key];
  const eqFieldFor = { colors:'color', tags:'tag', crests:'crest', avatars:'avatar', backgrounds:'background' };

  const blocks = CATS.map(([cat,label])=>{
    const owned = user.owned[cat] || [];
    const eqField = eqFieldFor[cat];
    const equippedId = user.equipped[eqField];
    const shopItems = state.shop[cat] || [];
    const ownedItems = shopItems.filter(it=> owned.includes(it.id));
    const pillHTML = ownedItems.length ? ownedItems.map(it=>{
      const isEq = equippedId===it.id;
      const swatch = (cat==='colors'||cat==='backgrounds') ? `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${it.hex};margin-right:4px;"></span>` : '';
      const emojiPart = (cat==='crests'||cat==='avatars') && it.emoji ? `${it.emoji} ` : '';
      const label2 = `${swatch}${emojiPart}${escapeHTML(it.label)}`;
      return `<div class="owned-pill ${isEq?'equipped':''}">${label2} <button data-equip="${cat}" data-id="${escapeAttr(it.id)}">${isEq?'tirar':'usar'}</button></div>`;
    }).join('') : `<span style="color:var(--muted);font-size:12.5px;">Nada comprado ainda — <a href="loja.html">visite a loja</a>.</span>`;
    return `
      <div class="card side-card">
        <h3>${label}</h3>
        <div class="owned-grid">${pillHTML}</div>
      </div>
    `;
  }).join('');

  const ownsCustomPhoto = (user.owned.avatars||[]).includes('custom_photo');
  const customEquipped = user.equipped.avatar === 'custom_photo';
  const stats = user.stats || { lifetimeWon:0, lifetimeLost:0 };
  const net = stats.lifetimeWon - stats.lifetimeLost;
  const houseTake = typeof state.houseTake==='number' ? state.houseTake : 0;
  const statusCard = `
    <div class="card side-card">
      <h3>Status geral da conta</h3>
      <div class="owned-grid" style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;"><span style="color:var(--dim);">Saldo atual</span><span class="mono">${fmt(user.balance)} pts</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;"><span style="color:var(--dim);">Ganho na vida da conta</span><span class="mono" style="color:var(--good);">+${fmt(stats.lifetimeWon)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;"><span style="color:var(--dim);">Perdido na vida da conta</span><span class="mono" style="color:var(--bad);">-${fmt(stats.lifetimeLost)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px;"><span style="color:var(--dim);">Líquido</span><span class="mono" style="color:${net>=0?'var(--good)':'var(--bad)'};">${net>=0?'+':''}${fmt(net)}</span></div>
      </div>
      <div class="admin-note" style="margin-top:10px;">Conta pontos ganhos/perdidos em apostas, roleta, corrida, blackjack e caça-níquel. Banca da casa no momento: <span class="mono">${fmt(houseTake)} pts</span>.</div>
    </div>
  `;
  const photoCard = `
    <div class="card side-card">
      <h3>Foto personalizada</h3>
      ${ownsCustomPhoto ? `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
          <div class="profile-avatar" style="width:56px;height:56px;font-size:26px;">${user.customAvatarData ? `<img src="${user.customAvatarData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />` : '📷'}</div>
          <div style="font-size:12px;color:var(--dim);">${user.customAvatarData ? 'Sua foto está salva.' : 'Você ainda não enviou uma foto.'}</div>
        </div>
        <input type="file" id="photoFile" accept="image/*" style="margin-bottom:8px;" />
        <div class="admin-row">
          <button class="submit-bet" id="uploadPhotoBtn" style="flex:1;">Enviar foto</button>
          ${user.customAvatarData ? `<button class="ibtn ${customEquipped?'equipped':'equip'}" id="equipPhotoBtn" style="flex:1;">${customEquipped?'Equipada':'Usar como avatar'}</button>` : ''}
        </div>
        <div class="admin-note">A foto é recortada em quadrado e comprimida — fica só neste jogo, na sua conta.</div>
      ` : `<div style="font-size:12.5px;color:var(--dim);">Item comprável na <a href="loja.html">loja</a>, aba "Foto de perfil" — 10.000 pontos.</div>`}
    </div>
  `;

  return `
    <div class="profile-head">
      <div class="profile-avatar">${avatarContentHTML(user.username)}</div>
      <div>
        <h1 class="display">${nameHTML(user.username)}</h1>
        <div class="tagline">${fmt(user.balance)} pontos ${user.isAdmin ? '· conta da casa (fora do ranking)' : '· na mesa desde '+fmtDate(user.createdAt||Date.now())}</div>
      </div>
    </div>
    <div class="profile-grid">
      <div>${blocks}</div>
      <div>
        ${statusCard}
        ${photoCard}
        <div class="card side-card">
          <h3>Trocar senha</h3>
          <div class="form-row"><input type="password" id="curPw" placeholder="Senha atual" /></div>
          <div class="form-row"><input type="password" id="newPw" placeholder="Nova senha" /></div>
          <div class="gate-error">${pwError ? escapeHTML(pwError) : (pwOk ? '' : '')}</div>
          ${pwOk ? `<div style="color:var(--good);font-size:12.5px;margin-bottom:8px;">${escapeHTML(pwOk)}</div>` : ''}
          <button class="submit-bet" id="changePwBtn">Salvar nova senha</button>
        </div>
      </div>
    </div>
  `;
}

function bindProfile(){
  document.querySelectorAll('[data-equip]').forEach(b=>{
    b.onclick = async ()=>{ await equipItem(b.dataset.equip, b.dataset.id); render(); };
  });
  const uploadBtn = document.getElementById('uploadPhotoBtn');
  if(uploadBtn) uploadBtn.onclick = async ()=>{
    const fileInput = document.getElementById('photoFile');
    const file = fileInput && fileInput.files && fileInput.files[0];
    if(!file){ toast('Escolha uma imagem primeiro'); return; }
    if(file.size > 8*1024*1024){ toast('Imagem muito grande (máx. 8MB)'); return; }
    uploadBtn.disabled = true;
    try{
      const dataUrl = await resizeImageToDataURL(file, 160);
      await loadState();
      const u = state.users[me.key];
      u.customAvatarData = dataUrl;
      u.equipped.avatar = 'custom_photo';
      await saveState();
      toast('Foto salva e equipada');
      render();
    }catch(err){
      console.error(err);
      toast('Não consegui processar essa imagem');
      uploadBtn.disabled = false;
    }
  };
  const equipPhotoBtn = document.getElementById('equipPhotoBtn');
  if(equipPhotoBtn) equipPhotoBtn.onclick = async ()=>{ await equipItem('avatars','custom_photo'); render(); };
  const btn = document.getElementById('changePwBtn');
  if(btn) btn.onclick = async ()=>{
    const cur = document.getElementById('curPw').value;
    const nw = document.getElementById('newPw').value;
    try{
      const res = await changePassword(cur, nw);
      if(!res.ok){ pwError = res.error; pwOk=''; render(); return; }
      pwError=''; pwOk='Senha atualizada.';
      render();
    }catch(err){
      console.error(err);
      pwError = 'Algo deu errado ao trocar a senha. Veja o console do navegador.';
      pwOk=''; render();
    }
  };
}

async function boot(){
  loadSession();
  await loadState();
  render();
}
boot();
</script>
</body>
</html>
