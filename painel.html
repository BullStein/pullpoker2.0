<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Salão — Painel do Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
<script>
let shopTab = 'colors';
let newCrestEmoji = '';

function render(){
  const app = document.getElementById('app');
  loadSession();
  if(!sessionStillValid()){
    clearSession();
    app.innerHTML = navHTML('painel.html') + `<div class="guard-msg"><h2>Você precisa entrar</h2><p><a href="index.html">Ir para a Mesa</a></p></div>`;
    bindNav();
    return;
  }
  const user = state.users[me.key];
  if(!user.isAdmin){
    app.innerHTML = navHTML('painel.html') + `<div class="guard-msg"><h2>Área restrita</h2><p>Só a conta do host pode ver o painel.</p></div>`;
    bindNav();
    return;
  }
  app.innerHTML = navHTML('painel.html') + renderPanel();
  bindPanel();
  bindNav();
}

function renderPanel(){
  const banned = state.banned || [];
  const closed = state.settings.closed || {};
  const shopTabs = [['colors','Cores'],['tags','Tags'],['crests','Brasões'],['backgrounds','Fundos de nome'],['avatars','Fotos de perfil']];
  const closures = [
    ['loja','Loja'],
    ['apostas','Apostas (opções fixas / palpite livre)'],
    ['cacaniquel','Caça-níquel'],
    ['cavalos','Corridas de cavalo']
  ];
  const announcements = (state.announcements||[]).slice().reverse();

  return `
    <div class="admin-hero">
      <h1 class="display">Painel do Host</h1>
      <p>Controle total da mesa — jogadores, chat, loja, corridas e as regras do cassino.</p>
    </div>
    <div class="admin-grid">
      <div>
        <div class="card side-card">
          <h3>♠ Jogadores</h3>
          <div class="admin-sub">
            <h4>Dar / zerar pontos</h4>
            <div class="admin-row">
              <input type="text" id="grantName" placeholder="nome do jogador" />
              <input type="number" id="grantAmt" placeholder="pontos" style="width:90px;" />
              <button id="grantBtn">Dar pontos</button>
            </div>
            <div class="admin-row">
              <input type="text" id="resetName" placeholder="nome do jogador" />
              <button id="resetBtn">Zerar saldo</button>
            </div>
            <div class="admin-note">Pontos concedidos aqui não saem de ninguém — são criados pela casa.</div>
          </div>
          <div class="admin-sub">
            <h4>Saldo inicial de novos jogadores</h4>
            <div class="admin-row">
              <input type="number" id="startBalanceInput" value="${state.settings.startBalance}" style="width:100px;" />
              <button id="setStartBalanceBtn">Salvar</button>
            </div>
          </div>
          <div class="admin-sub">
            <h4>Banir jogador</h4>
            <div class="admin-row">
              <input type="text" id="banName" placeholder="nome do jogador" />
              <button id="banBtn">Banir</button>
            </div>
            <div class="banned-list">
              ${banned.length ? banned.map(n=> `<div class="banned-chip">${escapeHTML(n)}<button data-unban="${escapeAttr(n)}">×</button></div>`).join('') : '<span style="font-size:11.5px;color:var(--muted);">Ninguém banido.</span>'}
            </div>
          </div>
        </div>

        <div class="card side-card">
          <h3>♥ Chat e mesa</h3>
          <div class="admin-sub">
            <h4>Anúncio no topo da página (evento / aviso da Casa)</h4>
            <div class="admin-row">
              <input type="text" id="announceInput" placeholder="mensagem de destaque no topo da Mesa" />
              <button id="announceBtn">Publicar</button>
            </div>
            <div class="banned-list">
              ${announcements.length ? announcements.map(a=> `<div class="banned-chip">${escapeHTML(a.text)}<button data-del-announce="${a.id}">×</button></div>`).join('') : '<span style="font-size:11.5px;color:var(--muted);">Nenhum anúncio publicado.</span>'}
            </div>
            <div class="admin-note">Aparece em destaque no topo da Mesa, separado do chat. Veja também a página <a href="eventos.html">Eventos</a> para o log de bugs/avisos.</div>
          </div>
          <div class="admin-sub">
            <h4>Enviar mensagem ao chat como A Casa</h4>
            <div class="admin-row">
              <input type="text" id="chatAnnounceInput" placeholder="mensagem para o chat" />
              <button id="chatAnnounceBtn">Enviar</button>
            </div>
          </div>
          <div class="admin-sub">
            <h4>Ações rápidas</h4>
            <div class="admin-row">
              <button id="clearChatBtn" style="flex:1;">Limpar chat</button>
              <button id="cancelAllBetsBtn" style="flex:1;">Cancelar apostas normais abertas</button>
            </div>
            <div class="admin-row">
              <button id="cancelHorsesBtn" style="flex:1;">Cancelar corridas de cavalo abertas</button>
            </div>
            <div class="admin-note">"Apostas normais" e "corridas de cavalo" agora são canceladas separadamente — nenhum dos dois botões mexe no outro tipo. Para excluir uma aposta encerrada específica, use o botão "Excluir postagem" dela na Mesa.</div>
          </div>
        </div>

        <div class="card side-card">
          <h3>♤ Fechar seções da mesa</h3>
          <div class="admin-note" style="margin-bottom:10px;">Fechar uma seção impede apostas/compras/giros novos ali, mas o que já existe continua visível.</div>
          ${closures.map(([k,label])=> `
            <div class="admin-row" style="justify-content:space-between;">
              <span style="font-size:13px;">${label}</span>
              <button data-toggle-closed="${k}" class="${closed[k]?'':''}" style="background:${closed[k]?'var(--bad)':'var(--good)'};color:#0a0a0a;font-weight:700;">${closed[k] ? 'Fechado — reabrir' : 'Aberto — fechar'}</button>
            </div>
          `).join('')}
        </div>

        <div class="card side-card">
          <h3>♧ Backup de dados</h3>
          <div class="admin-note" style="margin-bottom:8px;">Baixe um arquivo com todos os usuários, saldos, apostas e loja — ou suba um arquivo salvo antes para restaurar.</div>
          <div class="admin-row">
            <button id="exportBtn" style="flex:1;">⬇ Baixar backup completo</button>
          </div>
          <div class="admin-row">
            <label style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--oxblood-bright);color:var(--cream);padding:9px 14px;font-size:12px;font-weight:600;border-radius:3px;cursor:pointer;">
              ⬆ Importar backup (substitui tudo)
              <input type="file" id="importFile" accept="application/json" style="display:none;" />
            </label>
          </div>
        </div>
      </div>

      <div>
        <div class="card side-card">
          <h3>♦ Regras do cassino</h3>
          <div class="admin-sub">
            <h4>Custo para abrir uma aposta</h4>
            <div class="admin-row">
              <input type="number" id="cfgBetCost" value="${config.betCost}" style="width:100px;" />
              <span style="font-size:12px;color:var(--dim);">pontos</span>
            </div>
          </div>
          <div class="admin-sub">
            <h4>Pontos grátis</h4>
            <div class="admin-row">
              <input type="number" id="cfgFpAmount" value="${config.freePoints.amount}" placeholder="valor" style="width:100px;" />
              <span style="font-size:12px;color:var(--dim);">pontos a cada</span>
              <input type="number" id="cfgFpCooldown" value="${config.freePoints.cooldownMinutes}" placeholder="minutos" style="width:90px;" />
              <span style="font-size:12px;color:var(--dim);">min</span>
            </div>
          </div>
          <div class="admin-sub">
            <h4>Caça-níquel</h4>
            <div class="admin-row">
              <span style="font-size:12px;color:var(--dim);width:100%;">Tempo de espera entre giros grátis:</span>
              <input type="number" id="cfgSlotCooldown" value="${config.slot.cooldownSeconds}" style="width:90px;" />
              <span style="font-size:12px;color:var(--dim);">segundos</span>
            </div>
            <div class="admin-row">
              <span style="font-size:12px;color:var(--dim);width:100%;">Ganhos por resultado:</span>
            </div>
            <div class="admin-row">
              <span style="font-size:12px;color:var(--dim);width:70px;">🎰 três 7️⃣</span>
              <input type="number" id="cfgPayTriple7" value="${config.slot.payouts.triple7}" style="width:90px;" />
              <span style="font-size:12px;color:var(--dim);width:90px;">três iguais</span>
              <input type="number" id="cfgPayTripleOutro" value="${config.slot.payouts.tripleOutro}" style="width:90px;" />
            </div>
            <div class="admin-row">
              <span style="font-size:12px;color:var(--dim);width:70px;">duas iguais</span>
              <input type="number" id="cfgPayPar" value="${config.slot.payouts.par}" style="width:90px;" />
              <span style="font-size:12px;color:var(--dim);width:90px;">nada bateu</span>
              <input type="number" id="cfgPayNada" value="${config.slot.payouts.nada}" style="width:90px;" />
            </div>
          </div>
          <div class="admin-row" style="margin-top:10px;">
            <button id="saveConfigBtn" style="flex:1;background:var(--brass-bright);color:#221004;font-weight:700;">Salvar regras do cassino</button>
          </div>
        </div>

        <div class="card side-card">
          <h3>♣ Gerenciar loja</h3>
          <div class="shop-tabs">
            ${shopTabs.map(([k,label])=> `<button class="shop-tab ${shopTab===k?'active':''}" data-shoptab="${k}">${label}</button>`).join('')}
          </div>
          ${shopTab==='crests'||shopTab==='avatars' ? `
            <div class="emoji-pick-row">
              ${CREST_SUGGESTIONS.map(e=> `<button type="button" class="emoji-pick ${newCrestEmoji===e?'active':''}" data-pick-emoji="${e}">${e}</button>`).join('')}
            </div>
          ` : ''}
          <div class="admin-row">
            ${shopTab==='crests'||shopTab==='avatars' ? `<input type="text" id="newItemEmoji" placeholder="emoji" style="width:60px;" value="${escapeAttr(newCrestEmoji)}" maxlength="4" />` : ''}
            <input type="text" id="newItemLabel" placeholder="${shopTab==='tags' ? 'texto da tag' : 'nome do item'}" />
            ${shopTab==='colors'||shopTab==='backgrounds' ? `<input type="color" id="newItemHex" value="#c9a24b" style="width:50px;padding:2px;" />` : ''}
            <input type="number" id="newItemPrice" placeholder="preço" style="width:80px;" />
            <button id="addShopItemBtn">Adicionar</button>
          </div>
          <div class="shop-manage-list">
            ${(state.shop[shopTab]||[]).map(it=> `<div class="shop-chip">${(shopTab==='crests'||shopTab==='avatars') ? (it.id===CUSTOM_AVATAR_ID?'📷':it.emoji)+' ' : ''}${escapeHTML(it.label)}<button data-remove-item="${shopTab}" data-remove-id="${escapeAttr(it.id)}">×</button></div>`).join('') || '<span style="font-size:11.5px;color:var(--muted);">Vazio.</span>'}
          </div>
          <div class="admin-note">Itens removidos daqui deixam de aparecer na loja (quem já comprou mantém o que tinha). ${shopTab==='avatars' ? 'Cuidado: o item "📷 Foto customizada" é o que libera o upload de foto no Perfil.' : ''}</div>
        </div>
      </div>
    </div>
  `;
}

async function refreshAndSave(mutator){
  await loadState();
  mutator();
  await saveState();
  render();
}

function bindPanel(){
  document.getElementById('grantBtn').onclick = async ()=>{
    const name = document.getElementById('grantName').value.trim();
    const amt = parseInt(document.getElementById('grantAmt').value, 10);
    if(!name || !amt){ toast('Preencha nome e valor'); return; }
    const key = name.toLowerCase();
    if(!state.users[key]){ toast('Jogador não encontrado'); return; }
    await refreshAndSave(()=>{ state.users[key].balance += amt; });
    toast(`${fmt(amt)} pontos concedidos a ${name}`);
  };
  document.getElementById('resetBtn').onclick = async ()=>{
    const name = document.getElementById('resetName').value.trim();
    if(!name){ toast('Preencha o nome'); return; }
    const key = name.toLowerCase();
    if(!state.users[key]){ toast('Jogador não encontrado'); return; }
    await refreshAndSave(()=>{ state.users[key].balance = state.settings.startBalance; });
    toast(`${name} foi zerado para ${state.settings.startBalance}`);
  };
  document.getElementById('setStartBalanceBtn').onclick = async ()=>{
    const val = parseInt(document.getElementById('startBalanceInput').value, 10);
    if(isNaN(val) || val<0){ toast('Valor inválido'); return; }
    await refreshAndSave(()=>{ state.settings.startBalance = val; });
    toast(`Saldo inicial definido para ${fmt(val)}`);
  };
  document.getElementById('announceBtn').onclick = async ()=>{
    const input = document.getElementById('announceInput');
    const text = input.value.trim();
    if(!text){ toast('Escreva uma mensagem'); return; }
    await refreshAndSave(()=>{
      if(!state.announcements) state.announcements = [];
      state.announcements.push({ id: uid('an_'), text, ts: Date.now(), host: me.username });
      if(state.announcements.length > 30) state.announcements = state.announcements.slice(-30);
    });
    toast('Anúncio publicado no topo da mesa');
  };
  document.querySelectorAll('[data-del-announce]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delAnnounce;
      await refreshAndSave(()=>{ state.announcements = (state.announcements||[]).filter(a=> a.id!==id); });
    };
  });
  document.getElementById('chatAnnounceBtn').onclick = async ()=>{
    const input = document.getElementById('chatAnnounceInput');
    const text = input.value.trim();
    if(!text){ toast('Escreva uma mensagem'); return; }
    await refreshAndSave(()=>{
      if(!state.chat) state.chat = [];
      state.chat.push({ id: uid('m_'), user: me.username, text, ts: Date.now(), house: true });
      if(state.chat.length > 200) state.chat = state.chat.slice(-200);
    });
    toast('Mensagem enviada ao chat');
  };
  document.getElementById('banBtn').onclick = async ()=>{
    const name = document.getElementById('banName').value.trim();
    if(!name){ toast('Preencha o nome'); return; }
    await refreshAndSave(()=>{
      if(!state.banned) state.banned = [];
      if(!state.banned.includes(name)) state.banned.push(name);
    });
    toast(`${name} foi banido da mesa`);
  };
  document.querySelectorAll('[data-unban]').forEach(b=>{
    b.onclick = async ()=>{
      const name = b.dataset.unban;
      await refreshAndSave(()=>{ state.banned = (state.banned||[]).filter(n=> n!==name); });
      toast(`${name} foi desbanido`);
    };
  });
  document.getElementById('clearChatBtn').onclick = async ()=>{
    if(!confirm('Limpar todo o histórico do chat?')) return;
    await refreshAndSave(()=>{ state.chat = []; });
    toast('Chat limpo');
  };
  document.getElementById('cancelAllBetsBtn').onclick = async ()=>{
    if(!confirm('Cancelar TODAS as apostas normais abertas (opções fixas / palpite livre) e devolver os pontos apostados? Corridas de cavalo abertas NÃO são afetadas por este botão.')) return;
    await refreshAndSave(()=>{
      const isTargetOpen = b=> b.status==='aberta' && b.type!=='cavalo';
      state.bets.filter(isTargetOpen).forEach(b=>{ b.wagers.forEach(w=>{ const u=state.users[String(w.user).toLowerCase()]; if(u) u.balance += w.amount; }); });
      state.bets = state.bets.filter(b=> !isTargetOpen(b));
    });
    toast('Apostas normais abertas canceladas, pontos devolvidos');
  };
  const cancelHorsesBtn = document.getElementById('cancelHorsesBtn');
  if(cancelHorsesBtn) cancelHorsesBtn.onclick = async ()=>{
    if(!confirm('Cancelar TODAS as corridas de cavalo abertas e devolver os pontos apostados?')) return;
    await refreshAndSave(()=>{
      const isTargetOpen = b=> b.status==='aberta' && b.type==='cavalo';
      state.bets.filter(isTargetOpen).forEach(b=>{ b.wagers.forEach(w=>{ const u=state.users[String(w.user).toLowerCase()]; if(u) u.balance += w.amount; }); });
      state.bets = state.bets.filter(b=> !isTargetOpen(b));
    });
    toast('Corridas de cavalo abertas canceladas, pontos devolvidos');
  };

  document.querySelectorAll('[data-toggle-closed]').forEach(b=>{
    b.onclick = async ()=>{
      const k = b.dataset.toggleClosed;
      await refreshAndSave(()=>{
        if(!state.settings.closed) state.settings.closed = {};
        state.settings.closed[k] = !state.settings.closed[k];
      });
      toast(state.settings.closed[k] ? 'Seção fechada' : 'Seção reaberta');
    };
  });

  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `salao_backup_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup baixado');
  };
  document.getElementById('importFile').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm('Isso vai SUBSTITUIR todos os dados atuais (usuários, saldos, apostas, chat, loja) pelo arquivo escolhido. Essa ação não pode ser desfeita. Continuar?')){ e.target.value=''; return; }
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || typeof data !== 'object' || !data.users || !data.bets){ toast('Arquivo inválido — não parece um backup do Salão'); return; }
      state = data;
      await loadState();
      await saveState();
      toast('Backup importado com sucesso');
      render();
    }catch(err){
      console.error(err);
      toast('Não consegui ler esse arquivo');
    }finally{
      e.target.value = '';
    }
  };

  document.getElementById('saveConfigBtn').onclick = async ()=>{
    const betCost = parseInt(document.getElementById('cfgBetCost').value,10);
    const fpAmount = parseInt(document.getElementById('cfgFpAmount').value,10);
    const fpCooldown = parseInt(document.getElementById('cfgFpCooldown').value,10);
    const slotCooldown = parseInt(document.getElementById('cfgSlotCooldown').value,10);
    const payTriple7 = parseInt(document.getElementById('cfgPayTriple7').value,10);
    const payTripleOutro = parseInt(document.getElementById('cfgPayTripleOutro').value,10);
    const payPar = parseInt(document.getElementById('cfgPayPar').value,10);
    const payNada = parseInt(document.getElementById('cfgPayNada').value,10);
    if([betCost,fpAmount,fpCooldown,slotCooldown,payTriple7,payTripleOutro,payPar,payNada].some(v=> isNaN(v) || v<0)){
      toast('Preencha todos os valores com números válidos'); return;
    }
    await loadConfig();
    config.betCost = betCost;
    config.freePoints = { amount: fpAmount, cooldownMinutes: fpCooldown };
    config.slot = { cooldownSeconds: slotCooldown, payouts: { triple7: payTriple7, tripleOutro: payTripleOutro, par: payPar, nada: payNada } };
    await saveConfig();
    toast('Regras do cassino salvas');
    render();
  };

  document.querySelectorAll('[data-shoptab]').forEach(b=>{
    b.onclick = ()=>{ shopTab = b.dataset.shoptab; render(); };
  });
  document.querySelectorAll('[data-pick-emoji]').forEach(b=>{
    b.onclick = ()=>{ newCrestEmoji = b.dataset.pickEmoji; render(); };
  });
  document.getElementById('addShopItemBtn').onclick = async ()=>{
    const labelEl = document.getElementById('newItemLabel');
    const priceEl = document.getElementById('newItemPrice');
    const label = labelEl ? labelEl.value.trim() : '';
    const price = parseInt(priceEl ? priceEl.value : '', 10);
    if(!label){ toast('Dê um nome ao item'); return; }
    if(isNaN(price) || price<0){ toast('Preço inválido'); return; }
    const newItem = { id: uid('custom_'), label, price };
    if(shopTab==='colors' || shopTab==='backgrounds'){
      const hexEl = document.getElementById('newItemHex');
      newItem.hex = hexEl ? hexEl.value : '#c9a24b';
    }
    if(shopTab==='crests' || shopTab==='avatars'){
      const emojiEl = document.getElementById('newItemEmoji');
      const emoji = emojiEl ? emojiEl.value.trim() : '';
      if(!emoji){ toast('Escolha ou digite um emoji'); return; }
      newItem.emoji = emoji;
    }
    await refreshAndSave(()=>{
      if(!state.shop[shopTab]) state.shop[shopTab] = [];
      state.shop[shopTab].push(newItem);
    });
    newCrestEmoji = '';
    toast('Item adicionado à loja');
  };
  document.querySelectorAll('[data-remove-item]').forEach(b=>{
    b.onclick = async ()=>{
      const cat = b.dataset.removeItem, id = b.dataset.removeId;
      if(!confirm('Remover este item da loja?')) return;
      await refreshAndSave(()=>{ state.shop[cat] = (state.shop[cat]||[]).filter(i=> i.id!==id); });
      toast('Item removido da loja');
    };
  });
}

async function boot(){
  loadSession();
  await loadState();
  await loadConfig();
  render();
}
boot();
</script>
</body>
</html>
