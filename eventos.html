<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Salão — Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
<script>
let filterType = 'todos';

function render(){
  const app = document.getElementById('app');
  loadSession();
  if(!sessionStillValid()){
    clearSession();
    app.innerHTML = navHTML('eventos.html') + `
      <div class="guard-msg"><h2>Você precisa entrar</h2><p><a href="index.html">Ir para a Mesa</a></p></div>`;
    bindNav();
    return;
  }
  app.innerHTML = navHTML('eventos.html') + renderLog();
  bindLog();
}

function renderLog(){
  const all = [...(state.eventLog||[])].reverse();
  const types = Array.from(new Set(all.map(e=> e.type)));
  const filtered = filterType==='todos' ? all : all.filter(e=> e.type===filterType);

  const rows = filtered.length ? filtered.map(e=> `
    <div class="bet" style="padding:12px 16px;">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="status-tag aberta" style="border-color:var(--brass-dim);color:var(--brass-dim);">${escapeHTML(EVENT_LABELS[e.type]||e.type)}</span>
          <span style="font-size:13px;color:var(--cream);">${escapeHTML(e.text)}</span>
        </div>
        <span style="font-size:11px;color:var(--muted);white-space:nowrap;" class="mono">${fmtDate(e.ts)}</span>
      </div>
      ${e.by ? `<div style="font-size:11px;color:var(--muted);margin-top:4px;">por ${escapeHTML(e.by)}</div>` : ''}
    </div>
  `).join('') : '<div class="empty-state">Nenhum evento registrado ainda.</div>';

  return `
    <div class="games-hero">
      <h1 class="display">Log de Eventos</h1>
      <p>Histórico do que aconteceu na mesa — contas, apostas, corridas, mudanças do host.</p>
    </div>
    <div class="shop-tabs">
      <button class="shop-tab ${filterType==='todos'?'active':''}" data-filter="todos">Todos</button>
      ${types.map(t=> `<button class="shop-tab ${filterType===t?'active':''}" data-filter="${t}">${escapeHTML(EVENT_LABELS[t]||t)}</button>`).join('')}
    </div>
    <div class="bet-list">${rows}</div>
  `;
}

function bindLog(){
  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.onclick = ()=>{ filterType = b.dataset.filter; render(); };
  });
}

async function boot(){
  loadSession();
  await loadState();
  render();
  setInterval(async ()=>{ await loadState(); if(sessionStillValid()) render(); }, 5000);
}
boot();
</script>
</body>
</html>
