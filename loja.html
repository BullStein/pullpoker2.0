<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Salão — Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="app.js"></script>
<script>
let shopTab = 'colors';

function render(){
  const app = document.getElementById('app');
  loadSession();
  if(!sessionStillValid()){
    clearSession();
    app.innerHTML = navHTML('loja.html') + `
      <div class="guard-msg"><h2>Você precisa entrar</h2><p>Volte para a mesa e crie sua conta ou faça login para acessar a loja.</p>
      <p><a href="index.html">Ir para a Mesa</a></p></div>`;
    bindNav();
    return;
  }
  app.innerHTML = navHTML('loja.html') + leftDockHTML() + rightDockHTML() + renderShop();
  bindShop();
  bindNav();
  bindMiniSlot();
}

function renderShop(){
  const user = state.users[me.key];
  const shopLocked = state.locks && state.locks.shop;
  const tabs = [['colors','Cores de nome'],['tags','Tags'],['crests','Brasões'],['avatars','Foto de perfil'],['backgrounds','Fundo do nome']];
  const items = state.shop[shopTab] || [];
  const owned = user.owned[shopTab] || [];
  const eqField = shopTab==='colors' ? 'color' : shopTab==='tags' ? 'tag' : shopTab==='avatars' ? 'avatar' : shopTab==='backgrounds' ? 'background' : 'crest';
  const equippedId = user.equipped[eqField];

  const rows = items.length ? items.map(it=>{
    const isOwned = owned.includes(it.id);
    const isEquipped = equippedId === it.id;
    const canAfford = user.balance >= it.price;
    let preview;
    if(shopTab === 'colors' || shopTab === 'backgrounds'){
      preview = `<div class="preview" style="background:${it.hex};"></div>`;
    } else if(shopTab === 'tags'){
      preview = `<div class="label-tag">${escapeHTML(it.label)}</div>`;
    } else if(it.custom){
      preview = `<div class="preview premium">📷</div>`;
    } else {
      preview = `<div class="preview emoji">${it.emoji || ''}</div>`;
    }
    let btn;
    if(isOwned){
      btn = `<button class="ibtn ${isEquipped?'equipped':'equip'}" data-equip="${shopTab}" data-id="${escapeAttr(it.id)}">${isEquipped ? 'Equipado' : 'Equipar'}</button>`;
    } else {
      const disabled = shopLocked || !canAfford;
      btn = `<button class="ibtn ${(!shopLocked && canAfford)?'buy':'locked'}" data-buy="${shopTab}" data-id="${escapeAttr(it.id)}" ${disabled?'disabled':''}>${shopLocked?'Loja fechada':'Comprar'}</button>`;
    }
    return `<div class="shop-item">
      ${preview}
      <div class="info">
        <div class="iname">${escapeHTML(it.label)}</div>
        <div class="iprice mono">${it.price>0 ? fmt(it.price)+' pts' : 'grátis'}</div>
        ${it.custom ? `<div style="font-size:11px;color:var(--muted);">envie a foto na página Perfil</div>` : ''}
      </div>
      ${btn}
    </div>`;
  }).join('') : '<div class="shop-empty">O host ainda não adicionou itens aqui.</div>';

  return `
    <div class="shop-hero">
      <h1 class="display">A Loja</h1>
      <p>Gaste seus pontos em estilo — cores, tags, brasões e uma foto de perfil pra chamar de sua.</p>
      ${shopLocked ? `<div class="gate-error" style="margin-top:8px;">A loja está fechada pelo host no momento — dá pra equipar o que você já tem, mas não pra comprar coisa nova.</div>` : ''}
    </div>
    <div class="shop-tabs">
      ${tabs.map(([k,label])=> `<button class="shop-tab ${shopTab===k?'active':''}" data-shoptab="${k}">${label}</button>`).join('')}
    </div>
    <div class="shop-grid">${rows}</div>
  `;
}

function bindShop(){
  document.querySelectorAll('[data-shoptab]').forEach(b=>{
    b.onclick = ()=>{ shopTab = b.dataset.shoptab; render(); };
  });
  document.querySelectorAll('[data-buy]').forEach(b=>{
    b.onclick = async ()=>{
      if(state.locks && state.locks.shop){ toast('Loja fechada pelo host'); return; }
      await buyItem(b.dataset.buy, b.dataset.id); render();
    };
  });
  document.querySelectorAll('[data-equip]').forEach(b=>{
    b.onclick = async ()=>{ await equipItem(b.dataset.equip, b.dataset.id); render(); };
  });
}

async function boot(){
  loadSession();
  await loadState();
  render();
  setInterval(async ()=>{ await loadState(); if(sessionStillValid()) render(); }, 4000);
}
boot();
</script>
</body>
</html>
