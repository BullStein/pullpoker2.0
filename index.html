<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salão de Apostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080a;
    --panel:#131315;
    --panel-2:#0e0e10;
    --line:#28282c;
    --red:#d81a2c;
    --red-dim:#7a121e;
    --red-bright:#f8324a;
    --red-glow: rgba(216,26,44,.35);
    --gold:#e8c85a;
    --white:#f3f1ee;
    --dim:#a8a7ac;
    --muted:#6f6e74;
    --shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 85% -10%, rgba(216,26,44,.20), transparent 60%),
      radial-gradient(ellipse 700px 500px at 8% 15%, rgba(216,26,44,.10), transparent 55%),
      radial-gradient(ellipse 900px 700px at 50% 115%, rgba(120,10,20,.18), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    background-size: 180% 180%, 180% 180%, 180% 180%, auto;
    animation: bgDrift 26s ease-in-out infinite;
    color:var(--white);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse 80% 70% at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%);
  }
  @keyframes bgDrift{
    0%,100%{ background-position: 0% 0%, 100% 20%, 50% 100%, 0 0; }
    50%{ background-position: 15% 10%, 85% 5%, 45% 92%, 0 0; }
  }
  @media (prefers-reduced-motion: reduce){ body{ animation:none; } }
  @keyframes neonFlicker{
    0%,100%{ opacity:1; text-shadow: 0 0 10px var(--red-glow), 0 0 22px var(--red-glow); }
    92%{ opacity:1; text-shadow: 0 0 10px var(--red-glow), 0 0 22px var(--red-glow); }
    93%{ opacity:.4; text-shadow:none; }
    95%{ opacity:1; text-shadow: 0 0 10px var(--red-glow), 0 0 22px var(--red-glow); }
    96%{ opacity:.5; text-shadow:none; }
    98%{ opacity:1; text-shadow: 0 0 10px var(--red-glow), 0 0 22px var(--red-glow); }
  }

  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.5px;
    font-weight:600;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a{color:var(--red);}
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
    border-radius:3px;
    transition: transform .12s ease, filter .12s ease, background .15s ease;
  }
  button:active{ transform: scale(.97); }
  button:disabled{ opacity:.35; cursor:not-allowed; filter:none; transform:none; }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }
  input, select, textarea{
    background:#0c0c0e;
    border:1px solid var(--line);
    color:var(--white);
    border-radius:3px;
    padding:8px 10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }

  /* ---------- shell ---------- */
  #app{ max-width:1180px; margin:0 auto; padding:0 18px 60px; position:relative; z-index:1; }

  .hud{
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, #0a0a0aef, #0a0a0ad0 80%, transparent);
    backdrop-filter: blur(6px);
    padding:16px 18px 12px;
    margin:0 -18px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .hud .brand{ font-size:21px; font-weight:700; color:var(--white); white-space:nowrap; display:flex; align-items:baseline; gap:8px; }
  .hud .brand span.mark{ color:var(--red); animation: neonFlicker 5s ease-in-out 1; }
  .hud .brand em{ font-style:normal; color:var(--muted); font-weight:400; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; margin-left:2px; font-family:'Inter',sans-serif; }
  .hud .spacer{ flex:1; }
  .balance-pill{
    display:flex; align-items:center; gap:9px;
    background:var(--panel); border:1px solid var(--red-dim); border-radius:3px;
    padding:6px 14px 6px 8px;
  }
  .chip-dot{
    width:20px;height:20px;border-radius:50%;
    background:var(--red);
    border:2px solid #2a0508;
    box-shadow: 0 0 0 2px var(--red) inset;
  }
  .balance-pill .num{ font-size:16px; font-weight:700; color:var(--white); }
  .who{ font-size:12.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .who b{ color:var(--white); }

  .ticker-wrap{
    overflow:hidden; white-space:nowrap;
    border-bottom:1px solid var(--line);
    background:var(--panel-2);
    padding:7px 0;
    margin:0 -18px 22px;
  }
  .ticker-wrap.empty{ display:none; }
  .ticker{
    display:inline-block;
    padding-left:100%;
    animation: scrollTicker 28s linear infinite;
    font-size:12.5px; color:var(--dim);
  }
  .ticker span{ margin-right:46px; }
  .ticker b{ color:var(--red); }
  @keyframes scrollTicker{ 0%{ transform:translateX(0); } 100%{ transform:translateX(-100%); } }
  @media (prefers-reduced-motion: reduce){ .ticker{ animation:none; padding-left:0; } }

  .gate{
    max-width:420px; margin:12vh auto; text-align:center;
    position:relative;
  }
  .gate .kanji{ font-size:13px; color:var(--red-dim); letter-spacing:4px; margin-bottom:6px; }
  .gate h1{ font-size:38px; margin-bottom:4px; line-height:1; }
  .gate h1 span{ color:var(--red); animation: neonFlicker 5s ease-in-out 1; }
  .gate p{ color:var(--dim); font-size:14px; margin-bottom:22px; text-transform:none; letter-spacing:0; font-family:'Inter',sans-serif; }
  .gate input{ width:100%; text-align:center; font-size:16px; padding:12px; margin-bottom:12px; }
  .gate button{ width:100%; padding:13px; background:var(--red); color:var(--white); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:1px; }
  .gate button:hover{ background:#f02338; }

  .layout{ display:grid; grid-template-columns: 1.7fr 1fr; gap:22px; align-items:start; }
  @media (max-width: 860px){ .layout{ grid-template-columns:1fr; } }

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin-bottom:14px;
    border-bottom:2px solid var(--red);
    padding-bottom:8px;
  }
  .section-head h2{ font-size:17px; margin:0; color:var(--white); }
  .section-head .hint{ font-size:12px; color:var(--muted); }

  .new-bet-toggle{
    background:var(--red); color:var(--white); font-weight:700; font-size:12px;
    padding:9px 14px; text-transform:uppercase; letter-spacing:.5px;
  }
  .new-bet-toggle:hover{ background:#f02338; }

  .card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 18px;
    box-shadow:var(--shadow);
  }

  .new-bet-form{ margin-bottom:20px; }
  .new-bet-form .row{ display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .new-bet-form input[type=text]{ flex:1; min-width:160px; }
  .type-toggle{ display:flex; gap:8px; }
  .type-toggle button{
    background:#0c0c0e; border:1px solid var(--line); color:var(--dim);
    padding:8px 12px; font-size:12px; text-transform:uppercase; letter-spacing:.5px;
  }
  .type-toggle button.active{ background:var(--red); color:var(--white); border-color:var(--red); font-weight:600; }
  .new-bet-form .opts-hint{ font-size:11.5px; color:var(--muted); margin:-4px 0 10px; }
  .submit-bet{ background:var(--red); color:var(--white); font-weight:700; padding:10px 18px; font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; }
  .submit-bet:hover{ background:#f02338; }

  .bet-list{ display:flex; flex-direction:column; gap:14px; }
  .bet{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 18px 14px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .bet::before{
    content:''; position:absolute; inset:0 0 auto 0; height:3px;
    background:var(--red);
  }
  .bet.closed::before{ background:var(--muted); }
  .bet-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:6px;}
  .bet-title{ font-size:16.5px; font-weight:600; color:var(--white); line-height:1.3; font-family:'Inter',sans-serif; text-transform:none; letter-spacing:0; }
  .bet-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .status-tag{
    font-size:10.5px; padding:3px 9px; border-radius:2px; white-space:nowrap; flex-shrink:0;
    text-transform:uppercase; letter-spacing:.5px; font-weight:600;
  }
  .status-tag.aberta{ background:transparent; color:var(--red); border:1px solid var(--red); }
  .status-tag.fechada{ background:var(--panel-2); color:var(--muted); border:1px solid var(--line); }

  .pot-line{ font-size:12px; color:var(--dim); margin:8px 0 10px; }
  .pot-line .mono{ color:var(--white); }

  .option-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 4px; border-bottom:1px solid var(--line);
  }
  .option-row:last-child{ border-bottom:none; }
  .option-row .oname{ flex:1; font-size:13.5px; }
  .option-row .oname.void{ color:var(--muted); font-style:italic; }
  .option-row .opool{ font-size:11.5px; color:var(--muted); min-width:70px; text-align:right; }
  .option-row input[type=number]{ width:70px; }
  .option-row button.wager-btn{
    background:transparent; color:var(--red); border:1px solid var(--red);
    padding:6px 10px; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
  }
  .option-row button.wager-btn:hover{ background:var(--red); color:var(--white); }
  .option-row.winner{ background:rgba(216,26,44,.1); border-radius:2px; }
  .option-row.winner .oname::after{ content:' — vencedora'; color:var(--red); font-size:11px; font-weight:600; font-style:normal; }

  .open-input-row{ display:flex; gap:8px; margin-top:8px; }
  .open-input-row input[type=text]{ flex:1; }

  .my-wagers{ margin-top:8px; font-size:11.5px; color:var(--muted); }
  .my-wagers b{ color:var(--dim); }

  .host-controls{
    margin-top:12px; padding-top:10px; border-top:1px solid var(--line);
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .host-controls select{ flex:1; min-width:140px; }
  .host-controls button.resolve{ background:var(--red); color:var(--white); font-weight:700; font-size:12px; padding:8px 14px; text-transform:uppercase; letter-spacing:.5px; }
  .host-controls button.resolve:hover{ background:#f02338; }
  .host-controls button.void-bet{ background:transparent; border:1px solid var(--muted); color:var(--muted); font-size:11.5px; padding:7px 12px; }
  .host-controls .host-label{ font-size:11px; color:var(--muted); width:100%; text-transform:uppercase; letter-spacing:.5px; }

  .result-note{ margin-top:10px; font-size:12.5px; color:var(--red); font-style:italic; }

  /* sidebar */
  .side-card{ margin-bottom:18px; }
  .leaderboard-row{ display:flex; align-items:center; gap:10px; padding:7px 2px; font-size:13.5px; }
  .leaderboard-row .rank{ width:20px; color:var(--muted); font-size:12px; }
  .leaderboard-row .name{ flex:1; }
  .leaderboard-row .amt{ color:var(--red); font-weight:600; }
  .leaderboard-row.me{ background:rgba(216,26,44,.1); border-radius:2px; }

  .bonus-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .bonus-row .desc{ font-size:12.5px; color:var(--dim); flex:1; }
  .bonus-btn{
    background:var(--red); color:var(--white); font-weight:700; font-size:12px; padding:9px 14px; white-space:nowrap;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .bonus-btn:hover:not(.cooldown){ background:#f02338; }
  .bonus-btn.cooldown{ background:var(--panel-2); color:var(--muted); border:1px solid var(--line); }

  .slot{
    display:flex; gap:6px; justify-content:center; margin:10px 0;
  }
  .reel{
    width:44px; height:44px; background:var(--panel-2); border:1px solid var(--red-dim);
    border-radius:3px; display:flex; align-items:center; justify-content:center;
    font-size:22px;
  }
  .reel.spin{ animation: reelSpin .09s linear infinite; }
  @keyframes reelSpin{ 0%{ transform:translateY(0);} 100%{ transform:translateY(6px);} }
  .slot-result{ text-align:center; font-size:12.5px; color:var(--dim); min-height:16px; }

  .admin-toggle{ font-size:11px; color:var(--muted); background:none; border:none; text-decoration:underline; padding:4px 0; text-transform:uppercase; letter-spacing:.5px; }
  .admin-box{ margin-top:8px; display:flex; gap:8px; }
  .admin-box input{ flex:1; }
  .admin-panel{ border:1px solid var(--red-dim); }
  .admin-panel h3{ font-size:13px; margin:0 0 10px; color:var(--red); letter-spacing:.5px; }
  .admin-row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .admin-row input{ flex:1; min-width:90px; }
  .admin-row button{ background:var(--red-dim); color:var(--white); font-size:11.5px; padding:8px 12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .admin-row button:hover{ background:var(--red); }
  .admin-note{ font-size:11px; color:var(--muted); margin-top:6px;}

  .admin-sub{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .admin-sub h4{ font-family:'Inter',sans-serif; font-size:11.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:0 0 8px; }
  .banned-list, .shop-manage-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .banned-chip, .shop-chip{
    display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:2px; padding:4px 6px; font-size:11.5px; color:var(--dim);
  }
  .banned-chip button, .shop-chip button{
    background:none; border:none; color:var(--muted); font-size:13px; line-height:1; padding:0 2px;
  }
  .banned-chip button:hover, .shop-chip button:hover{ color:var(--red); }
  .emoji-pick-row{ display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 8px; }
  .emoji-pick{ background:var(--panel-2); border:1px solid var(--line); font-size:16px; padding:4px 7px; border-radius:2px; }
  .emoji-pick:hover{ border-color:var(--red); }
  .emoji-pick.active{ border-color:var(--red); background:rgba(216,26,44,.15); }

  .shop-card{ margin-bottom:18px; }
  .shop-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .shop-tab{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--dim);
    padding:8px; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px;
  }
  .shop-tab.active{ background:var(--red); color:var(--white); border-color:var(--red); font-weight:600; }
  .shop-items{ display:flex; flex-direction:column; gap:8px; }
  .shop-item{
    display:flex; align-items:center; gap:10px; padding:8px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:3px;
  }
  .shop-item .preview{ width:26px; height:26px; border-radius:50%; flex-shrink:0; border:1px solid var(--line); }
  .shop-item .preview.emoji{ font-size:18px; display:flex; align-items:center; justify-content:center; border-radius:3px; background:#0c0c0e; }
  .shop-item .label-tag{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--red);
    border:1px solid var(--red); border-radius:2px; padding:2px 5px;
  }
  .shop-item .info{ flex:1; min-width:0; }
  .shop-item .iname{ font-size:13px; color:var(--white); }
  .shop-item .iprice{ font-size:11px; color:var(--muted); }
  .shop-item .ibtn{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; padding:7px 11px; white-space:nowrap; }
  .shop-item .ibtn.buy{ background:var(--red); color:var(--white); }
  .shop-item .ibtn.buy:hover{ background:#f02338; }
  .shop-item .ibtn.equip{ background:transparent; border:1px solid var(--dim); color:var(--dim); }
  .shop-item .ibtn.equip:hover{ border-color:var(--red); color:var(--red); }
  .shop-item .ibtn.equipped{ background:var(--panel-2); border:1px solid var(--red); color:var(--red); }
  .shop-item .ibtn.locked{ background:var(--panel-2); border:1px solid var(--line); color:var(--muted); cursor:not-allowed; }
  .shop-empty{ font-size:12px; color:var(--muted); text-align:center; padding:14px 0; }

  .chat-card{ display:flex; flex-direction:column; }
  .chat-log{
    height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:9px;
    padding-right:4px; margin-bottom:10px;
  }
  .chat-log::-webkit-scrollbar{ width:6px; }
  .chat-log::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
  .chat-msg{ font-size:12.5px; line-height:1.4; color:var(--dim); }
  .chat-msg b{ color:var(--red); font-weight:600; }
  .chat-msg.house{ background:rgba(216,26,44,.08); border-left:2px solid var(--red); padding:6px 8px; border-radius:2px; }
  .chat-msg.house b{ color:var(--gold, #e8c85a); }
  .chat-msg .chat-time{ color:var(--muted); font-size:10px; float:right; }
  .crest{ margin-right:4px; }
  .name-tag{
    display:inline-block; margin-left:5px; font-size:9.5px; font-weight:700; letter-spacing:.5px;
    text-transform:uppercase; color:var(--red); border:1px solid var(--red); border-radius:2px;
    padding:1px 4px; vertical-align:middle;
  }
  .chat-empty{ font-size:12.5px; color:var(--muted); text-align:center; padding:20px 0; }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; }
  .chat-input-row button{ background:var(--red); color:var(--white); font-weight:700; font-size:12px; padding:8px 14px; text-transform:uppercase; letter-spacing:.5px; }
  .chat-input-row button:hover{ background:#f02338; }

  .empty-state{ font-size:13.5px; color:var(--muted); padding:24px 0; text-align:center; }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--red); color:var(--white);
    padding:10px 18px; border-radius:3px; font-size:13px; box-shadow:var(--shadow);
    z-index:50; opacity:0; transition:opacity .25s ease;
    pointer-events:none;
  }
  .toast.show{ opacity:1; }

  /* ---------- mafia casino: gradientes, glow e animações ---------- */
  .new-bet-toggle, .submit-bet, .host-controls button.resolve,
  .bonus-btn:not(.cooldown), .chat-input-row button, .shop-item .ibtn.buy, .gate button{
    background: linear-gradient(135deg, var(--red-bright), var(--red) 55%, var(--red-dim));
    position:relative; overflow:hidden; z-index:0;
  }
  .new-bet-toggle::before, .submit-bet::before, .host-controls button.resolve::before,
  .bonus-btn:not(.cooldown)::before, .chat-input-row button::before, .shop-item .ibtn.buy::before, .gate button::before{
    content:''; position:absolute; top:0; left:-60%; width:35%; height:100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,.4), transparent);
    transform: skewX(-18deg);
    transition: left .55s ease;
    pointer-events:none;
  }
  .new-bet-toggle:hover::before, .submit-bet:hover::before, .host-controls button.resolve:hover::before,
  .bonus-btn:not(.cooldown):hover::before, .chat-input-row button:hover::before, .shop-item .ibtn.buy:hover::before, .gate button:hover::before{
    left:130%;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow: 0 0 0 rgba(216,26,44,0); }
    50%{ box-shadow: 0 0 16px 1px var(--red-glow); }
  }
  .bonus-btn:not(.cooldown){ animation: pulseGlow 2.2s ease-in-out infinite; }

  .card, .bet, .shop-item{
    background: linear-gradient(165deg, #17171a, var(--panel-2) 75%);
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .bet:hover, .shop-item:hover{
    border-color: var(--red-dim);
    box-shadow: var(--shadow), 0 0 0 1px rgba(216,26,44,.15), 0 0 20px -4px var(--red-glow);
  }
  .bet.aberta-glow::before{
    background: linear-gradient(90deg, var(--red-dim), var(--red-bright), var(--red-dim));
    background-size:200% 100%;
    animation: shimmerBar 3.4s linear infinite;
  }
  @keyframes shimmerBar{ 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }

  .chip-dot{
    background: conic-gradient(from 0deg, var(--red-dim), var(--red-bright), var(--red-dim), var(--red-bright), var(--red-dim));
    animation: chipSpin 6s linear infinite;
  }
  @keyframes chipSpin{ 0%{ filter:hue-rotate(0deg) brightness(1); } 50%{ filter:hue-rotate(6deg) brightness(1.15); } 100%{ filter:hue-rotate(0deg) brightness(1); } }

  .balance-pill{ transition: box-shadow .3s ease; }

  .section-head{ position:relative; }
  .section-head::after{

    background: linear-gradient(90deg, var(--red), transparent);
    opacity:.7;
  }

  @media (prefers-reduced-motion: reduce){
    .bonus-btn:not(.cooldown), .bet.aberta-glow::before, .chip-dot{ animation:none; }
  }
</style>
</head>
<body>

<script>

let state = { users: {}, bets: [], chat: [], banned: [], settings: { startBalance: 500 }, shop: null };
let chatDraft = '';

let loginPinOpen = false;

let newCrestEmoji = '';

const DEFAULT_SHOP = {
  colors: [

};
const CREST_SUGGESTIONS = ['👑','💎','🔥','☠️','🐉','🦈','⚡','🃏','♠️','🎲','💰','🍀','🎯','🥇','🐺','🦁','🃏','🂡','🎰','🍒'];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=> t.classList.remove('show'), 2600);
}

async function loadState(){
  try{
    const r = await fetch('/api/state');
    if(r.ok) state = await r.json();
  }catch(e){ console.error('falha ao buscar estado', e); }
  if(!state.chat) state.chat = [];
  if(!state.banned) state.banned = [];
  if(!state.settings) state.settings = { startBalance: 500 };
  if(!state.shop) state.shop = JSON.parse(JSON.stringify(DEFAULT_SHOP));
}
async function saveState(){
  try{
    await fetch('/api/state', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(state)
    });
  }catch(e){ console.error('storage set failed', e); toast('Falha ao salvar — servidor está de pé?'); }
}
async function loadMe(){
  try{
    const raw = localStorage.getItem(ME_KEY);
    if(raw) me = JSON.parse(raw);
  }catch(e){ me = null; }
}
async function saveMe(){
  try{ localStorage.setItem(ME_KEY, JSON.stringify(me)); }catch(e){}
}

function ensureUser(name){
  if(!state.users[name]){
    state.users[name] = {
      balance: (state.settings && state.settings.startBalance) || START_BALANCE,
      lastBonus: 0, lastSpin: 0,
      owned: { colors: [], tags: [], crests: [] },
      equipped: { color: null, tag: null, crest: null }
    };
  }
  const u = state.users[name];
  if(!u.owned) u.owned = { colors: [], tags: [], crests: [] };
  if(!u.equipped) u.equipped = { color: null, tag: null, crest: null };
  return u;
}

function fmt(n){ return Math.round(n).toLocaleString('pt-BR'); }

function nameHTML(username){
  const u = state.users[username];
  const safeName = escapeHTML(username);
  if(!u || !u.equipped) return safeName;
  const eq = u.equipped;
  const color = eq.color && (state.shop.colors||[]).find(c=> c.id===eq.color);
  const tag = eq.tag && (state.shop.tags||[]).find(t=> t.id===eq.tag);
  const crest = eq.crest && (state.shop.crests||[]).find(k=> k.id===eq.crest);
  const nameStyle = color ? ` style="color:${color.hex};"` : '';
  const crestHtml = crest ? `<span class="crest" title="${escapeAttr(crest.label)}">${crest.emoji}</span>` : '';
  const tagHtml = tag ? `<span class="name-tag">${escapeHTML(tag.label)}</span>` : '';
  return `${crestHtml}<span${nameStyle}>${safeName}</span>${tagHtml}`;
}

// ---------------- rendering ----------------
function render(){
  const app = document.getElementById('app');
  if(me && me.name && (state.banned||[]).includes(me.name)){

}

function renderGate(){
  return `

    </div>
  `;
}
function bindGate(){
  const btn = document.getElementById('gateBtn');
  const input = document.getElementById('gateName');
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') btn.click(); });
  btn.addEventListener('click', async ()=>{
    const name = input.value.trim();
    if(!name){ toast('Escolha um nome'); return; }
    await loadState();
    if((state.banned||[]).includes(name)){ toast('Você foi banido desta mesa.'); return; }
    ensureUser(name);
    me = { name, isAdmin:false };
    await saveMe();
    await saveState();
    render();
  });
}

function tickerHTML(){
  const resolved = state.bets.filter(b=> b.status==='fechada').slice(-10).reverse();
  if(resolved.length===0) return '';
  const items = resolved.map(b=>{
    const label = b.winner === '__void__' ? 'a casa levou tudo' : `venceu "${escapeHTML(b.winner)}"`;
    return `<span><b>${escapeHTML(b.title)}</b> — ${label}</span>`;
  }).join('');
  return items + items; // duplicate for seamless loop
}

function renderApp(){
  const user = ensureUser(me.name);

  const leaderboard = Object.entries(state.users)

    .slice(0, 8);

  const bonusReady = now - (user.lastBonus||0) >= BONUS_COOLDOWN;

  return `

    <div class="layout">

        <div class="section-head">

        </div>
        ${newBetOpen ? renderNewBetForm() : ''}
        <div class="bet-list">
          ${sorted.length ? sorted.map(b=> renderBet(b, user)).join('') : '<div class="empty-state">Nenhuma aposta na mesa ainda. Abra a primeira.</div>'}
        </div>
      </div>

      <div>
        <div class="card side-card chat-card">
          <h3 style="margin:0 0 10px;font-size:14px;color:var(--red);">Chat ao vivo</h3>
          <div class="chat-log" id="chatLog">
            ${(state.chat||[]).length ? (state.chat||[]).map(m=>`
              <div class="chat-msg ${m.house?'house':''}"><b>${m.house ? 'A Casa 🂡' : nameHTML(m.user)}</b><span class="chat-time mono">${fmtTime(m.ts)}</span><br>${escapeHTML(m.text)}</div>
            `).join('') : '<div class="chat-empty">Ninguém falou nada ainda.</div>'}
          </div>
          <div class="chat-input-row">

            <div class="reel">🎲</div><div class="reel">🎲</div><div class="reel">🎲</div>

              <div class="rank mono">${i+1}</div>

        <div class="card side-card admin-panel" style="${me.isAdmin ? '' : 'display:none'}">
          ${renderAdminPanel()}

        <div class="card side-card" style="${me.isAdmin ? 'display:none':''}">
          <button class="admin-toggle" id="toggleAdminLogin">${loginPinOpen ? 'fechar' : 'sou o host da mesa'}</button>
          ${loginPinOpen ? `
            <div class="admin-box">
              <input type="password" id="adminPin" placeholder="senha do host" />
              <button id="adminPinBtn" style="background:var(--red-dim);color:var(--white);padding:8px 12px;font-size:12px;">Entrar</button>
            </div>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderShopCard(user){
  const tabs = [['colors','Cores'], ['tags','Tags'], ['crests','Brasões']];
  const items = (state.shop[shopTab] || []);
  const owned = user.owned[shopTab] || [];
  const equippedId = user.equipped[shopTab === 'colors' ? 'color' : shopTab === 'tags' ? 'tag' : 'crest'];
  const eqField = shopTab === 'colors' ? 'color' : shopTab === 'tags' ? 'tag' : 'crest';

  const rows = items.length ? items.map(it=>{
    const isOwned = owned.includes(it.id);
    const isEquipped = equippedId === it.id;
    const canAfford = user.balance >= it.price;
    const preview = shopTab === 'colors'
      ? `<div class="preview" style="background:${it.hex};"></div>`
      : shopTab === 'crests'
        ? `<div class="preview emoji">${it.emoji}</div>`
        : `<div class="label-tag">${escapeHTML(it.label)}</div>`;
    let btn;
    if(isOwned){
      btn = `<button class="ibtn ${isEquipped?'equipped':'equip'}" data-equip="${shopTab}" data-id="${escapeAttr(it.id)}">${isEquipped ? 'Equipado' : 'Equipar'}</button>`;
    } else {
      btn = `<button class="ibtn ${canAfford?'buy':'locked'}" data-buy="${shopTab}" data-id="${escapeAttr(it.id)}" ${canAfford?'':'disabled'}>Comprar</button>`;
    }
    return `<div class="shop-item">
      ${preview}
      <div class="info">
        <div class="iname">${escapeHTML(it.label)}</div>
        <div class="iprice mono">${it.price>0 ? fmt(it.price)+' pts' : 'grátis'}</div>
      </div>
      ${btn}
    </div>`;
  }).join('') : '<div class="shop-empty">O host ainda não adicionou itens aqui.</div>';

  return `
    <div class="card side-card shop-card">
      <h3 style="margin:0 0 10px;font-size:14px;color:var(--red);">Loja</h3>
      <div class="shop-tabs">
        ${tabs.map(([k,label])=> `<button class="shop-tab ${shopTab===k?'active':''}" data-shoptab="${k}">${label}</button>`).join('')}
      </div>
      <div class="shop-items">${rows}</div>
    </div>
  `;
}

function renderAdminPanel(){
  const banned = state.banned || [];
  const shopFields = {
    colors: [['label','Nome'],['hex','Cor'],['price','Preço']],
    tags: [['label','Texto da tag'],['price','Preço']],
    crests: [['emoji','Emoji'],['label','Nome'],['price','Preço']]
  };
  const shopLabelKey = { colors:'label', tags:'label', crests:'label' };

  return `
    <h3>Painel do host</h3>

    <div class="admin-row">

      <input type="number" id="grantAmt" placeholder="pontos" style="width:90px;" />
      <button id="grantBtn">Dar pontos</button>
    </div>
    <div class="admin-row">
      <input type="text" id="resetName" placeholder="nome do jogador" />
      <button id="resetBtn">Zerar saldo</button>
    </div>

    <div class="admin-sub">
      <h4>Saldo inicial dos novos jogadores</h4>
      <div class="admin-row">
        <input type="number" id="startBalanceInput" value="${state.settings.startBalance}" style="width:100px;" />
        <button id="setStartBalanceBtn">Salvar</button>
      </div>
    </div>

    <div class="admin-sub">
      <h4>Anunciar como A Casa</h4>
      <div class="admin-row">
        <input type="text" id="announceInput" placeholder="mensagem para o chat" />
        <button id="announceBtn">Enviar</button>
      </div>
    </div>

    <div class="admin-sub">
      <h4>Banir jogador</h4>
      <div class="admin-row">
        <input type="text" id="banName" placeholder="nome do jogador" />
        <button id="banBtn">Banir</button>
      </div>
      <div class="banned-list">
        ${banned.length ? banned.map(n=> `<div class="banned-chip">${escapeHTML(n)}<button data-unban="${escapeAttr(n)}">×</button></div>`).join('') : '<span style="font-size:11.5px;color:var(--muted);">Ninguém banido.</span>'}
      </div>
    </div>

    <div class="admin-sub">
      <h4>Mesa</h4>
      <div class="admin-row">
        <button id="clearChatBtn" style="flex:1;">Limpar chat</button>
        <button id="cancelAllBetsBtn" style="flex:1;">Cancelar todas as apostas</button>
      </div>
    </div>

    <div class="admin-sub">
      <h4>Gerenciar loja — aba atual: ${shopTab==='colors'?'Cores':shopTab==='tags'?'Tags':'Brasões'}</h4>
      ${shopTab==='crests' ? `
        <div class="emoji-pick-row">

      <div class="admin-row">
        ${shopTab==='crests' ? `<input type="text" id="newItemEmoji" placeholder="emoji" style="width:60px;" value="${escapeAttr(newCrestEmoji)}" maxlength="4" />` : ''}

        ${shopTab==='colors' ? `<input type="color" id="newItemHex" value="#d81a2c" style="width:50px;padding:2px;" />` : ''}

}

function fmtClock(ms){
  const s = Math.ceil(ms/1000);
  const m = Math.floor(s/60);
  const r = s%60;
  return `${m}:${r.toString().padStart(2,'0')}`;
}

function fmtTime(ts){
  return new Date(ts).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}

function renderNewBetForm(){
  return `
    <div class="card new-bet-form">
      <div class="row">
        <input type="text" id="betTitle" placeholder='Ex: "Vai chover até sábado?"' />
      </div>
      <div class="row">
        <div class="type-toggle">
          <button data-type="fixa" class="${newBetType==='fixa'?'active':''}">Opções fixas</button>
          <button data-type="aberta" class="${newBetType==='aberta'?'active':''}">Palpite livre</button>
        </div>
      </div>
      ${newBetType==='fixa' ? `
        <div class="row"><input type="text" id="betOptions" placeholder="Opções separadas por vírgula: Sim, Não" /></div>
        <div class="opts-hint">"Nenhuma das opções" é adicionada sozinha, para quando nada bater.</div>
      ` : `
        <div class="opts-hint">Cada pessoa escreve seu próprio palpite ao apostar. "Nenhuma das opções" fica disponível para quando ninguém acertar.</div>
      `}
      <button class="submit-bet" id="createBetBtn">Abrir aposta</button>
    </div>
  `;
}

function renderBet(bet, user){
  const pot = bet.wagers.reduce((s,w)=> s+w.amount, 0);
  const isHost = bet.creator === me.name;
  const canResolve = (isHost || me.isAdmin) && bet.status==='aberta';
  const myWagers = bet.wagers.filter(w=> w.user===me.name);

  const optionsWithVoid = bet.type==='fixa' ? [...bet.options] : [...bet.options];
  if(!optionsWithVoid.includes('Nenhuma das opções')) optionsWithVoid.push('Nenhuma das opções');

  const poolByOption = {};
  optionsWithVoid.forEach(o=> poolByOption[o] = 0);
  bet.wagers.forEach(w=> poolByOption[w.option] = (poolByOption[w.option]||0) + w.amount);

  const rows = optionsWithVoid.map(opt=>{
    const isVoidOpt = opt==='Nenhuma das opções';
    const isWinnerRow = bet.status==='fechada' && bet.winner===opt;
    const poolTxt = poolByOption[opt] ? `${fmt(poolByOption[opt])} pts` : '—';
    if(bet.status==='fechada'){
      return `<div class="option-row ${isWinnerRow?'winner':''}">
        <div class="oname ${isVoidOpt?'void':''}">${escapeHTML(opt)}</div>
        <div class="opool mono">${poolTxt}</div>
      </div>`;
    }
    return `<div class="option-row">
      <div class="oname ${isVoidOpt?'void':''}">${escapeHTML(opt)}</div>
      <div class="opool mono">${poolTxt}</div>
      <input type="number" min="1" placeholder="pts" class="wagerAmt" data-bet="${bet.id}" data-opt="${escapeAttr(opt)}" />
      <button class="wager-btn" data-bet="${bet.id}" data-opt="${escapeAttr(opt)}">Apostar</button>
    </div>`;
  }).join('');

  const openInput = (bet.status==='aberta' && bet.type==='aberta') ? `
    <div class="open-input-row">
      <input type="text" id="openGuess_${bet.id}" placeholder="Seu palpite" />
      <input type="number" min="1" style="width:80px;" id="openAmt_${bet.id}" placeholder="pts" />
      <button class="wager-btn" data-open-bet="${bet.id}">Apostar</button>
    </div>` : '';

  const resolveControls = canResolve ? `
    <div class="host-controls">
      <div class="host-label">${isHost ? 'Você é o anfitrião — escolha o resultado certo' : 'Controle de host (admin)'}</div>
      <select id="resolveSel_${bet.id}">
        ${optionsWithVoid.map(o=> `<option value="${escapeAttr(o)}">${escapeHTML(o)}</option>`).join('')}
      </select>
      <button class="resolve" data-resolve-bet="${bet.id}">Encerrar e pagar</button>
      <button class="void-bet" data-void-bet="${bet.id}">Cancelar (reembolsar)</button>
    </div>` : '';

  const resultNote = bet.status==='fechada' ? `
    <div class="result-note">${bet.winner==='Nenhuma das opções' ? 'A casa levou o pote — ninguém apostou na resposta certa.' : `"${escapeHTML(bet.winner)}" venceu. Pote dividido entre quem apostou nela.`}</div>
  ` : '';

  return `
    <div class="bet ${bet.status==='fechada'?'closed':'aberta-glow'}">
      <div class="bet-top">
        <div>
          <div class="bet-title">${escapeHTML(bet.title)}</div>
          <div class="bet-meta">aberta por ${nameHTML(bet.creator)} · ${bet.type==='fixa' ? 'opções fixas' : 'palpite livre'}</div>
        </div>
        <div class="status-tag ${bet.status}">${bet.status==='aberta' ? 'aberta' : 'encerrada'}</div>
      </div>
      <div class="pot-line">Pote total: <span class="mono">${fmt(pot)} pts</span></div>
      ${rows}
      ${openInput}
      ${myWagers.length ? `<div class="my-wagers">Você apostou: ${myWagers.map(w=>`<b>${fmt(w.amount)}</b> em "${escapeHTML(w.option)}"`).join(', ')}</div>` : ''}
      ${resolveControls}
      ${resultNote}
    </div>
  `;
}

function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHTML(s).replace(/"/g,'&quot;'); }

// ---------------- actions ----------------
async function refreshAndSave(mutator){
  await loadState();
  mutator();
  await saveState();
  render();
}

function bindApp(){
  const user = ensureUser(me.name);

  document.getElementById('toggleNewBet').onclick = ()=>{ newBetOpen = !newBetOpen; render(); };

  document.querySelectorAll('.type-toggle button').forEach(b=>{
    b.onclick = ()=>{ newBetType = b.dataset.type; render(); };
  });

  const createBtn = document.getElementById('createBetBtn');
  if(createBtn) createBtn.onclick = async ()=>{
    const title = document.getElementById('betTitle').value.trim();
    if(!title){ toast('Dê um título para a aposta'); return; }
    let options = [];
    if(newBetType==='fixa'){
      const raw = document.getElementById('betOptions').value.trim();
      options = raw.split(',').map(s=>s.trim()).filter(Boolean);
      if(options.length < 1){ toast('Adicione ao menos uma opção'); return; }
    }
    await refreshAndSave(()=>{
      state.bets.push({
        id: 'b'+Date.now()+Math.random().toString(36).slice(2,7),
        title, type:newBetType, options, creator: me.name,
        status:'aberta', wagers:[], winner:null, createdAt: Date.now()
      });
    });
    newBetOpen = false;
    toast('Aposta aberta na mesa');
    render();
  };

  document.querySelectorAll('.wager-btn[data-bet]').forEach(btn=>{
    btn.onclick = async ()=>{
      const betId = btn.dataset.bet, opt = btn.dataset.opt;
      const input = document.querySelector(`.wagerAmt[data-bet="${betId}"][data-opt="${cssEscape(opt)}"]`);
      const amt = parseInt(input.value, 10);
      if(!amt || amt<=0){ toast('Digite um valor válido'); return; }
      await placeWager(betId, opt, amt);
    };
  });

  document.querySelectorAll('[data-open-bet]').forEach(btn=>{
    btn.onclick = async ()=>{
      const betId = btn.dataset.openBet;
      const guess = document.getElementById('openGuess_'+betId).value.trim();
      const amt = parseInt(document.getElementById('openAmt_'+betId).value, 10);
      if(!guess){ toast('Escreva seu palpite'); return; }
      if(!amt || amt<=0){ toast('Digite um valor válido'); return; }
      await placeWager(betId, guess, amt, true);
    };
  });

  document.querySelectorAll('[data-resolve-bet]').forEach(btn=>{
    btn.onclick = async ()=>{
      const betId = btn.dataset.resolveBet;
      const sel = document.getElementById('resolveSel_'+betId);
      const winner = sel.value;
      if(!confirm(`Encerrar esta aposta com "${winner}" como resultado certo?`)) return;
      await resolveBet(betId, winner);
    };
  });

  document.querySelectorAll('[data-void-bet]').forEach(btn=>{
    btn.onclick = async ()=>{
      const betId = btn.dataset.voidBet;
      if(!confirm('Cancelar aposta e devolver os pontos de todos?')) return;
      await voidBet(betId);
    };
  });

  const bonusBtn = document.getElementById('bonusBtn');
  if(bonusBtn) bonusBtn.onclick = async ()=>{
    await refreshAndSave(()=>{
      const u = ensureUser(me.name);
      if(now - (u.lastBonus||0) < BONUS_COOLDOWN) return;
      u.balance += BONUS_AMOUNT;
      u.lastBonus = Date.now();
    });
    toast(`+${BONUS_AMOUNT} pontos da casa`);
  };

  const spinBtn = document.getElementById('spinBtn');
  if(spinBtn) spinBtn.onclick = ()=> runSlot();

  const chatInput = document.getElementById('chatInput');
  if(chatInput){
    chatInput.oninput = e=> { chatDraft = e.target.value; };
    chatInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
  }
  const chatSendBtn = document.getElementById('chatSendBtn');
  if(chatSendBtn) chatSendBtn.onclick = ()=> sendChat();
}

async function sendChat(){
  const text = chatDraft.trim();
  if(!text) return;
  chatDraft = '';
  await refreshAndSave(()=>{
    if(!state.chat) state.chat = [];
    state.chat.push({ user: me.name, text, ts: Date.now() });
    if(state.chat.length > 200) state.chat = state.chat.slice(-200);
  });
}

function cssEscape(s){ return s.replace(/["\\]/g, '\\$&'); }

async function buyItem(category, id){
  await loadState();
  const item = (state.shop[category]||[]).find(i=> i.id===id);
  const u = ensureUser(me.name);
  if(!item){ toast('Esse item não existe mais'); render(); return; }
  if((u.owned[category]||[]).includes(id)){ toast('Você já tem isso'); render(); return; }
  if(u.balance < item.price){ toast('Pontos insuficientes'); render(); return; }
  u.balance -= item.price;
  u.owned[category].push(id);
  await saveState();
  toast(`Comprou "${item.label}"`);
  render();
}

async function equipItem(category, id){
  await loadState();
  const u = ensureUser(me.name);
  const field = category==='colors' ? 'color' : category==='tags' ? 'tag' : 'crest';
  u.equipped[field] = (u.equipped[field] === id) ? null : id;
  await saveState();
  render();
}

async function placeWager(betId, option, amount, isOpenGuess=false){
  await loadState();
  const bet = state.bets.find(b=> b.id===betId);
  const u = ensureUser(me.name);
  if(!bet || bet.status!=='aberta'){ toast('Essa aposta já foi encerrada'); render(); return; }
  if(amount > u.balance){ toast('Você não tem pontos suficientes'); return; }
  u.balance -= amount;
  if(isOpenGuess){
    const existing = bet.options.find(o=> o.toLowerCase()===option.toLowerCase());
    const finalOpt = existing || option;
    if(!existing) bet.options.push(option);
    bet.wagers.push({ user: me.name, option: finalOpt, amount, ts: Date.now() });
  } else {
    bet.wagers.push({ user: me.name, option, amount, ts: Date.now() });
  }
  await saveState();
  toast(`Apostou ${fmt(amount)} pontos`);
  render();
}

async function resolveBet(betId, winner){
  await loadState();
  const bet = state.bets.find(b=> b.id===betId);
  if(!bet || bet.status!=='aberta') { render(); return; }
  bet.status = 'fechada';
  const pot = bet.wagers.reduce((s,w)=> s+w.amount, 0);
  const winningWagers = bet.wagers.filter(w=> w.option===winner);
  const winPool = winningWagers.reduce((s,w)=> s+w.amount, 0);
  if(winPool > 0){
    winningWagers.forEach(w=>{
      const u = ensureUser(w.user);
      const share = w.amount / winPool;
      u.balance += w.amount + share * (pot - winPool);
    });
    bet.winner = winner;
  } else {
    bet.winner = 'Nenhuma das opções';
  }
  await saveState();
  toast('Aposta encerrada e paga');
  render();
}

async function voidBet(betId){
  await loadState();
  const bet = state.bets.find(b=> b.id===betId);
  if(!bet) return;
  bet.wagers.forEach(w=>{
    const u = ensureUser(w.user);
    u.balance += w.amount;
  });
  state.bets = state.bets.filter(b=> b.id!==betId);
  await saveState();
  toast('Aposta cancelada, pontos devolvidos');
  render();
}

async function runSlot(){
  const user = ensureUser(me.name);
  if(now - (user.lastSpin||0) < SPIN_COOLDOWN || spinning) return;
  spinning = true;
  render();
  const reels = document.querySelectorAll('#slotReels .reel');
  reels.forEach(r=> r.classList.add('spin'));
  const spinTicks = setInterval(()=>{
    reels.forEach(r=> r.textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]);
  }, 90);

  await new Promise(res=> setTimeout(res, 1100));
  clearInterval(spinTicks);
  reels.forEach(r=> r.classList.remove('spin'));

  const final = [rand(SYMBOLS), rand(SYMBOLS), rand(SYMBOLS)];
  reels.forEach((r,i)=> r.textContent = final[i]);

  let win = 0;
  if(final[0]===final[1] && final[1]===final[2]){
    win = final[0]==='7️⃣' ? 500 : 150;
  } else if(final[0]===final[1] || final[1]===final[2] || final[0]===final[2]){
    win = 40;
  } else {
    win = 10;
  }

  document.getElementById('slotResult').textContent = win>=150 ? `JACKPOT! +${win} pontos` : `+${win} pontos`;

  await refreshAndSave(()=>{
    const u = ensureUser(me.name);
    u.balance += win;
    u.lastSpin = Date.now();
  });
  spinning = false;
  render();
  toast(win>=150 ? `Jackpot! +${win} pontos` : `+${win} pontos no caça-níquel`);
}
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

document.addEventListener('click', async (e)=>{
  if(e.target.id==='toggleAdminLogin'){ loginPinOpen = !loginPinOpen; render(); }
  if(e.target.id==='adminPinBtn'){
    const pin = document.getElementById('adminPin').value;
    if(pin === ADMIN_PIN){
      me.isAdmin = true;
      await saveMe();
      loginPinOpen = false;
      toast('Acesso de host liberado');
      render();
    } else {
      toast('Senha incorreta');
    }
  }
  if(e.target.id==='grantBtn'){
    const name = document.getElementById('grantName').value.trim();
    const amt = parseInt(document.getElementById('grantAmt').value, 10);
    if(!name || !amt){ toast('Preencha nome e valor'); return; }
    await refreshAndSave(()=>{
      const u = ensureUser(name);
      u.balance += amt;
    });
    toast(`${fmt(amt)} pontos concedidos a ${name}`);
  }
  if(e.target.id==='resetBtn'){
    const name = document.getElementById('resetName').value.trim();
    if(!name){ toast('Preencha o nome'); return; }
    await refreshAndSave(()=>{
      const u = ensureUser(name);
      u.balance = state.settings.startBalance;
    });
    toast(`${name} foi zerado para ${state.settings.startBalance}`);
  }
  if(e.target.id==='setStartBalanceBtn'){
    const val = parseInt(document.getElementById('startBalanceInput').value, 10);
    if(isNaN(val) || val<0){ toast('Valor inválido'); return; }
    await refreshAndSave(()=>{
      if(!state.settings) state.settings = {};
      state.settings.startBalance = val;
    });
    toast(`Saldo inicial definido para ${fmt(val)}`);
  }
  if(e.target.id==='announceBtn'){
    const input = document.getElementById('announceInput');
    const text = input.value.trim();
    if(!text){ toast('Escreva uma mensagem'); return; }
    await refreshAndSave(()=>{
      if(!state.chat) state.chat = [];
      state.chat.push({ user:'A Casa', text, ts:Date.now(), house:true });
      if(state.chat.length > 200) state.chat = state.chat.slice(-200);
    });
    toast('Anúncio enviado ao chat');
  }
  if(e.target.id==='banBtn'){
    const name = document.getElementById('banName').value.trim();
    if(!name){ toast('Preencha o nome'); return; }
    await refreshAndSave(()=>{
      if(!state.banned) state.banned = [];
      if(!state.banned.includes(name)) state.banned.push(name);
    });
    toast(`${name} foi banido da mesa`);
  }
  if(e.target.dataset.unban){
    const name = e.target.dataset.unban;
    await refreshAndSave(()=>{
      state.banned = (state.banned||[]).filter(n=> n!==name);
    });
    toast(`${name} foi desbanido`);
  }
  if(e.target.id==='clearChatBtn'){
    if(!confirm('Limpar todo o histórico do chat?')) return;
    await refreshAndSave(()=>{ state.chat = []; });
    toast('Chat limpo');
  }
  if(e.target.id==='cancelAllBetsBtn'){
    if(!confirm('Cancelar TODAS as apostas abertas e devolver os pontos apostados?')) return;
    await refreshAndSave(()=>{
      const open = state.bets.filter(b=> b.status==='aberta');
      open.forEach(b=>{
        b.wagers.forEach(w=>{
          const u = ensureUser(w.user);
          u.balance += w.amount;
        });
      });
      state.bets = state.bets.filter(b=> b.status!=='aberta');
    });
    toast('Apostas abertas canceladas, pontos devolvidos');
  }
  if(e.target.dataset.shoptab){
    shopTab = e.target.dataset.shoptab;
    render();
  }
  if(e.target.dataset.pickEmoji){
    newCrestEmoji = e.target.dataset.pickEmoji;
    render();
  }
  if(e.target.dataset.buy){
    await buyItem(e.target.dataset.buy, e.target.dataset.id);
  }
  if(e.target.dataset.equip){
    await equipItem(e.target.dataset.equip, e.target.dataset.id);
  }
  if(e.target.id==='addShopItemBtn'){
    const labelEl = document.getElementById('newItemLabel');
    const priceEl = document.getElementById('newItemPrice');
    const label = labelEl ? labelEl.value.trim() : '';
    const price = parseInt(priceEl ? priceEl.value : '', 10);
    if(!label){ toast('Dê um nome ao item'); return; }
    if(isNaN(price) || price<0){ toast('Preço inválido'); return; }
    const newItem = {
      id: 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      label, price
    };
    if(shopTab==='colors'){
      const hexEl = document.getElementById('newItemHex');
      newItem.hex = hexEl ? hexEl.value : '#d81a2c';
    }
    if(shopTab==='crests'){
      const emojiEl = document.getElementById('newItemEmoji');
      const emoji = emojiEl ? emojiEl.value.trim() : '';
      if(!emoji){ toast('Escolha ou digite um emoji'); return; }
      newItem.emoji = emoji;
    }
    await refreshAndSave(()=>{
      if(!state.shop[shopTab]) state.shop[shopTab] = [];
      state.shop[shopTab].push(newItem);
    });
    newCrestEmoji = '';
    toast('Item adicionado à loja');
  }
  if(e.target.dataset.removeItem){
    const cat = e.target.dataset.removeItem;
    const id = e.target.dataset.removeId;
    if(!confirm('Remover este item da loja?')) return;
    await refreshAndSave(()=>{
      state.shop[cat] = (state.shop[cat]||[]).filter(i=> i.id!==id);
    });
    toast('Item removido da loja');
  }
});

// ---------------- boot & polling ----------------
async function boot(){
  await loadMe();
  await loadState();
  render();
  setInterval(async ()=>{
    now = Date.now();
    const active = document.activeElement;
    const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
    if(isTyping || newBetOpen) return; // não interrompe quem está digitando ou preenchendo o formulário
    await loadState();
    render();
  }, 2500);
}
boot();
</script>
